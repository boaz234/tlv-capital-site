<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TLV Capital</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .container {
      max-width: 1000px;
      padding: 40px;
    }
    .logo {
      max-width: 900px;
      width: 100%;
      margin-bottom: 80px;
    }
    h1 {
      font-size: 72px;
      font-weight: 300;
      margin: 0 0 30px 0;
      letter-spacing: 1px;
    }
    .divider {
      width: 220px;
      height: 1px;
      background-color: #666;
      margin: 40px auto;
    }
    .inquiries {
      font-size: 28px;
      color: #cccccc;
      font-weight: 300;
      letter-spacing: 0.5px;
    }
    .inquiries a {
      color: #d4b06a;
      text-decoration: none;
    }
    .inquiries a:hover {
      text-decoration: underline;
    }
    @media (max-width: 768px) {
      h1 {
        font-size: 42px;
      }
      .inquiries {
        font-size: 20px;
      }
      .logo {
        margin-bottom: 50px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="TLV_Capital_white_on_transparent_v2.png" alt="TLV Capital" class="logo">
    <h1>Website coming soon.</h1>
    <div class="divider"></div>
    <div class="inquiries">
      For inquiries:
      <a href="mailto:info@tlv-capital.co.il">
        info@tlv-capital.co.il
      </a>
    </div>
  </div>
</body>
</html>
